<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intérprete AR - Studio</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- CodeMirror para editor con sintaxis y números de línea -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>

    <style>
        :root {
            --bg-base: #0a0e17;
            --bg-surface: #111827;
            --bg-panel: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.4);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #10b981;
            --error: #f43f5e;
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-code: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }
        
        body {
            margin: 0; padding: 0;
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbars modernas */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Barra de navegación superior */
        .header {
            background: var(--bg-surface);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 6px;
            font-size: 14px;
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        .badge-status {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-status::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            display: inline-block;
        }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* Panel Lateral (Catálogo) */
        .sidebar {
            width: 240px;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-subtle);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .button-upload {
            background: rgba(99, 102, 241, 0.15);
            color: #c7d2fe;
            border: 1px solid rgba(99, 102, 241, 0.35);
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .button-upload:hover {
            background: rgba(99, 102, 241, 0.3);
            color: #ffffff;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .sidebar-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 14px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            padding: 9px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-code);
            color: #cbd5e1;
            transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .badge:hover {
            background: var(--bg-card-hover);
            color: #ffffff;
            border-color: var(--border-focus);
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Área del Editor */
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            overflow: hidden;
        }

        .editor-header {
            padding: 10px 20px;
            background: var(--bg-surface);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        .editor-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .shortcut-pill {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            border: 1px solid var(--border-subtle);
            font-family: var(--font-code);
        }
        
        .button-run {
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            color: white;
            border: none;
            padding: 7px 16px;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-ui);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: 0 2px 10px var(--accent-glow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .button-run:hover {
            background: linear-gradient(135deg, #7073ff, #5c55fa);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .button-run:active {
            transform: translateY(0);
        }

        /* Personalización de CodeMirror */
        .CodeMirror {
            flex: 0 0 140px;
            height: 140px !important;
            background: var(--bg-panel) !important;
            font-family: var(--font-code) !important;
            font-size: 14px !important;
            line-height: 1.6 !important;
            border-bottom: 1px solid var(--border-subtle);
        }

        .CodeMirror-gutters {
            background: #0d1322 !important;
            border-right: 1px solid var(--border-subtle) !important;
        }

        .CodeMirror-linenumber {
            color: #475569 !important;
            font-size: 12px !important;
        }

        .CodeMirror-cursor {
            border-left: 2px solid var(--accent) !important;
        }

        /* Fallback si no carga CodeMirror */
        textarea#codigo {
            flex: 0 0 140px;
            background: var(--bg-panel);
            color: #93c5fd;
            font-family: var(--font-code);
            font-size: 14px;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            padding: 16px 20px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        
        /* Área de Resultados */
        .results-area {
            flex: 1;
            background: var(--bg-base);
            padding: 24px;
            overflow: auto;
            color: var(--text-main);
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            margin-top: 60px;
            font-size: 14px;
        }
        
        /* Tabla de Resultados */
        .table-container {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--font-code);
            font-size: 13px;
        }

        th, td {
            border-bottom: 1px solid var(--border-subtle);
            padding: 11px 16px;
            text-align: left;
        }

        th {
            background: var(--bg-surface);
            color: #cbd5e1;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
            letter-spacing: 0.3px;
        }

        tr {
            background: var(--bg-panel);
            transition: background 0.15s ease;
        }

        tr:nth-child(even) {
            background: #0c121e;
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.08);
        }

        /* Mensajes de feedback */
        .feedback-box {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 13.5px;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: fadeIn 0.2s ease-in-out;
        }

        .feedback-error {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            border-left: 4px solid var(--error);
            color: #fda4af;
        }

        .feedback-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-left: 4px solid var(--success);
            color: #6ee7b7;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body role="application">
    <div class="header">
        <div class="header-brand">
            <span class="header-icon">⚡</span>
            <span>Álgebra Relacional Studio</span>
        </div>
        <div class="badge-status">Scotty Online</div>
    </div>

    <div class="main-content">
        <!-- Panel Izquierdo: Catálogo -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title" style="margin-bottom: 0;">Tablas en memoria</span>
                <button class="button-upload" onclick="abrirSelectorCSV()" title="Subir archivo .csv al catálogo">
                    <span>Cargar CSV</span>
                </button>
            </div>
            <input type="file" id="input-csv" accept=".csv" style="display: none;" onchange="procesarArchivoCSV(event)">
            <div id="lista-tablas">
                <div style="color: var(--text-muted); font-size: 13px;">⏳ Conectando...</div>
            </div>
        </div>
        
        <!-- Panel Derecho: Editor y Resultados -->
        <div class="editor-area">
            <div class="editor-header">
                <div class="editor-title">
                    <span>Editor de Consultas</span>
                    <span class="shortcut-pill">Ctrl+Enter / ⌘+Enter</span>
                </div>
                <button class="button-run" onclick="ejecutar()" title="Ejecutar consulta (Ctrl+Enter / ⌘+Enter)">
                    <span>▶</span> Ejecutar
                </button>
            </div>
            
            <textarea id="codigo" placeholder="-- Escribe tu consulta aquí...&#10;SELECT (CIUDAD = 'Londres') S"></textarea>
            
            <div class="results-area" id="resultado">
                <div class="placeholder-text">Los resultados de la consulta aparecerán aquí.</div>
            </div>
        </div>
    </div>

    <script>
        let editor = null;

        // Inicializar CodeMirror si está disponible
        try {
            if (typeof CodeMirror !== 'undefined') {
                editor = CodeMirror.fromTextArea(document.getElementById('codigo'), {
                    mode: 'text/x-sql',
                    theme: 'dracula',
                    lineNumbers: true,
                    autoCloseBrackets: true,
                    extraKeys: {
                        "Ctrl-Enter": function() { ejecutar(); },
                        "Cmd-Enter": function() { ejecutar(); }
                    }
                });
            }
        } catch (e) {
            console.warn("Editor fallback a textarea simple:", e);
        }

        // Listener fallback para textarea nativo si CodeMirror no estuviera activo
        document.getElementById('codigo').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                ejecutar();
            }
        });

        async function cargarCatalogo() {
            try {
                const res = await fetch('/api/catalog');
                const tablas = await res.json();
                const container = document.getElementById('lista-tablas');
                container.innerHTML = '';
                tablas.forEach(t => {
                    container.innerHTML += `
                        <div class="badge" onclick="verTabla('${t}')" title="Ver contenido de ${t}">
                            <span>🗄️ ${t}</span>
                            <span style="font-size: 11px; color: var(--text-muted);">tabla</span>
                        </div>`;
                });
            } catch (e) {
                document.getElementById('lista-tablas').innerHTML = 
                    '<div class="feedback-box feedback-error">Error al conectar con el servidor</div>';
            }
        }

        window.onload = function() {
            cargarCatalogo();
        };

        function abrirSelectorCSV() {
            const input = document.getElementById('input-csv');
            input.value = '';
            input.click();
        }

        async function procesarArchivoCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Obtener nombre base sin .csv y sanitizar
            const rawName = file.name.replace(/\.[^/.]+$/, "");
            let sugerencia = rawName.trim().replace(/[^a-zA-Z0-9_]/g, "_");
            if (/^[0-9]/.test(sugerencia)) {
                sugerencia = "T_" + sugerencia;
            }

            const nombreTabla = prompt("Nombre tabla nueva:", sugerencia);
            if (!nombreTabla || nombreTabla.trim() === "") return;

            let cleanNom = nombreTabla.trim().replace(/[^a-zA-Z0-9_]/g, "_");
            if (/^[0-9]/.test(cleanNom)) {
                cleanNom = "T_" + cleanNom;
            }

            const divRes = document.getElementById('resultado');
            divRes.innerHTML = `<div style='color: var(--text-muted); font-size: 14px;'>⏳ Subiendo y procesando ${file.name}...</div>`;

            try {
                const contenido = await file.text();
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: cleanNom, contenido: contenido })
                });
                const res = await response.json();

                if (res.status === 'ok') {
                    await cargarCatalogo();
                    divRes.innerHTML = `
                        <div class="feedback-box feedback-success">
                            <span>✅</span>
                            <div>${res.msg}</div>
                        </div>`;
                    verTabla(res.nombre);
                } else {
                    divRes.innerHTML = `
                        <div class="feedback-box feedback-error">
                            <span>❌</span>
                            <div><strong>Error al subir archivo:</strong><br>${res.msg}</div>
                        </div>`;
                }
            } catch (e) {
                divRes.innerHTML = `
                    <div class="feedback-box feedback-error">
                        <span>❌</span>
                        <div><strong>Error:</strong> Falló la comunicación con el servidor al subir el archivo.</div>
                    </div>`;
            }
        }

        function verTabla(nombre) {
            if (editor) {
                editor.setValue(nombre);
                editor.focus();
            } else {
                document.getElementById('codigo').value = nombre;
            }
            ejecutar();
        }

        async function ejecutar() {
            const rawCodigo = editor ? editor.getValue() : document.getElementById('codigo').value;
            const codigo = rawCodigo.trim();
            if (codigo === "") return;

            const divRes = document.getElementById('resultado');
            divRes.innerHTML = "<div style='color: var(--text-muted); font-size: 14px;'>⏳ Evaluando expresión en servidor Haskell...</div>";

            try {
                const url = '/api/ejecutar?consulta=' + encodeURIComponent(codigo);
                const response = await fetch(url, { method: 'POST' });
                const res = await response.json();

                if (res.status === 'error') {
                    divRes.innerHTML = `
                        <div class="feedback-box feedback-error">
                            <span>❌</span>
                            <div><strong>Error de evaluación:</strong><br><span style="font-family: var(--font-code); font-size: 12.5px;">${res.msg}</span></div>
                        </div>`;
                } else if (res.status === 'info') {
                    await cargarCatalogo(); // Recargar el catálogo izquierdo si hubo asignaciones
                    divRes.innerHTML = `
                        <div class="feedback-box feedback-success">
                            <span>✅</span>
                            <div>${res.msg}</div>
                        </div>`;
                } else {
                    dibujarTabla(res.data, divRes);
                }
            } catch (e) {
                divRes.innerHTML = `
                    <div class="feedback-box feedback-error">
                        <span>❌</span>
                        <div><strong>Error crítico:</strong> No se pudo comunicar con el servidor backend.</div>
                    </div>`;
            }
        }

        function dibujarTabla(filas, contenedor) {
            if (!filas || filas.length === 0) {
                contenedor.innerHTML = `
                    <div class="feedback-box feedback-success">
                        <span>✅</span>
                        <div>Consulta exitosa (0 tuplas resultantes).</div>
                    </div>`;
                return;
            }
            const columnas = Object.keys(filas[0]);
            let html = "<div class='table-container'><table><thead><tr>";
            columnas.forEach(col => html += `<th>${col}</th>`);
            html += "</tr></thead><tbody>";
            
            filas.forEach(fila => {
                html += "<tr>";
                columnas.forEach(col => html += `<td>${fila[col]}</td>`);
                html += "</tr>";
            });
            html += "</tbody></table></div>";
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
